<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronauta no espaço</title>
    <style>
        body {
            margin: 0px;
            padding: 0px;
        }

        main {
            height: 100vh;
            position: relative;
            background: black url("imagens/espaco.jpg") no-repeat fixed center center / cover;
        }

        img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <main>
        <img src="imagens/astronauta.png" alt="Astronauta">
    </main>
</body>
</html>

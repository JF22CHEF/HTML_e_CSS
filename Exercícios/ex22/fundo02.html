<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalização dos fundos</title>
    <style>
        body {
            background-image: url("https://gustavoguanabara.github.io/html-css/imagens/mascote.png");
            background-size: 300px 300px;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
    <p>background-size -> tamanho da imagem de fundo</p>
    <p>background-repeat -> controla a repetição da imagem</p>
    <p>background-position</p>
    <p>- muda a posição da imagem de fundo</p>
</body>
</html>

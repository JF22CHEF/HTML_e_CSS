<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O alinhamento vertical</title>
    <style>
        #container {
            position: relative;
            height: 500px;
            padding: 10px;
            background-color: purple;
        }

        #conteúdo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 200px;
            width: 400px;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteúdo">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ducimus, consequuntur doloribus quasi nihil ab dolorum ex mollitia ad, eum explicabo ipsam voluptatem iure, aspernatur ratione ea alias maiores debitis tempore.</p>
        </article>
    </section>
</body>
</html>

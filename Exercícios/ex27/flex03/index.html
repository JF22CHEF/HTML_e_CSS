<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexibleboxes</title>
    <style>
        div.container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
            /*
                propriedades do flex-wrap:
                nowrap -> ele segue o comportamento normal, não quebra os blocos, tenta expremer o conteúdo dos itens
                wrap -> após a dimunição suficiente do container, ele vai quebrar os itens no mesmo sentido do cross-axis, não expreme o conteúdo
                wrap-reverse -> após a dimunuição suficiente do container, ele vai quebrar os itens no sentido contrário do cross-axis, não expreme o conteúdo
                shorhand do flex-flox:
                flex-flow -> flex-direction + flex-wrap
            */
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de bloco A</div>
        <div class="item">Exemplo de bloco B</div>
        <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div>
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div>
        <div class="item">Exemplo de bloco G</div>
        <div class="item">Exemplo de bloco H</div>
    </div>
</body>
</html>

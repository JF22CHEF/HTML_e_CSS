<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eita a última flexible box</title>
    <style>
        div.container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            /* Ordem do shorhand flex */
            /* flex - flex-grow + flex-shrink + flex-basis */
        }

        div#cxA {
            /* flex: 0 1 auto */
            flex: initial;
        }
        div#cxB {
            /* flex: 0 0 auto */
            flex: none;
        }
        div#cxC {
            /* flex: 1 1 auto; */
            flex: auto;
        }
        div#cxD {
            flex: 2 auto; /* flex: 2 1 auto */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
        <div class="item" id="cxD">D</div>
    </div>
</body>
</html>

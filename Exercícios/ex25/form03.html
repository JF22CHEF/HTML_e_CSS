<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O meu formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Teu nome completo" autocomplete="name">
        </p>
        <p>
            <label for="imedia">Média: </label>
            <input type="number" name="media" id="imedia" required min="0" max="10" placeholder="De 0 a 10" step="0.1" autocomplete="cc-number">
        </p>
        <p>
            <label for="imes">O período letivo: </label>
            <input type="month" name="mes" id="imes" required value="2002-07" autocomplete="bday-month">
        </p>
        <p>
            <label for="idia">Dia da prova: </label>
            <input type="date" name="dia" id="idia" required value="2002-07-12" autocomplete="bday">
        </p>
        <p>
            <label for="ihora">Horário da prova: </label>
            <input type="time" name="hora" id="ihora" required value="08:00" autocomplete="bday-time">
        </p>
        <p>
            <label for="ie-mail">E-mail: </label>
            <input type="email" name="e-mail" id="ie-mail" required placeholder="O teu e-mail" autocomplete="email">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>

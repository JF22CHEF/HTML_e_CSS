<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agora é o último formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="off">
        <p>
            <label for="iano">Em que ano tu nasceste? </label>
            <input type="number" name="ano" id="iano" min="1900" max="2026" oninput="calcIdade()">
        </p>
        <p>
            <label for="iidade">Essa é a tua idade: </label>
            <output name="idade" id="iidade">0</output>
        </p>
        <p>
            <input type="reset" value="Limpar" onclick="document.getElementById('iano').value = '0'; document.getElementById('iidade').innerHTML = '0'">
        </p>
    </form>
    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apenas um formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>
                <h2>Dados para cadastro</h2>
            </legend>
            <p>
                <label for="inome">Nome: </label>
                <input type="text" name="nome" id="inome" required placeholder="Teu nome" maxlength="30" autocomplete="name">
            </p>
            <p>
                <label for="iidade">Idade: </label>
                <input type="number" name="idade" id="iidade" required min="0" placeholder="Tua idade" autocomplete="cc-number">
            </p>
            <p>
                <label for="ie-mail">E-mail: </label>
                <input type="email" id="ie-mail" name="e-mail" required placeholder="Teu e-mail" maxlength="50" autocomplete="email">
            </p>
            <p>
                <label for="itelefone">Telefone: </label>
                <input type="tel" id="itelefone" name="telefone" required placeholder="(XX) 9XXXX-XXXX" maxlength="15" autocomplete="tel" pattern="^\(\d{2}\) 9\d{4}-\d{4}$">
            </p>
        </fieldset>
        <!-- Estudar mais sobre RegEx -->
        <!--
        HTML5 telephone pattern
        HTML5 email pattern
        pattern="^[0-9]{2} [0-9]{5}-[0-9]{4}$"
        -->
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>

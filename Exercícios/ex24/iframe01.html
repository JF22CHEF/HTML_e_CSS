<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 500px;
            height: 500px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso do iframe</h1>
    <p>
        Acessando o site do
        <!-- Tamanho padrão 300x150 -->
        <!-- As CSS são soberanas -->
        <iframe src="https://www.cursoemvideo.com" frameborder="0" width="600" height="600" scrolling="yes">
            <a href="https://www.cursoemvideo.com" target="_blank" rel="External">Curso em Vídeo</a>
        </iframe>
        para aprender a programar e aprender IA
    </p>
    <p>
        O repositório do Gustavo Guanabara
        <iframe src="https://gustavoguanabara.github.io" frameborder="0" width="400" height="400" scrolling="yes">
            <a href="https://gustavoguanabara.github.io" target="_blank" rel="External">GitHub</a>
        </iframe>
        também é bem legal
    </p>
</body>
</html>
